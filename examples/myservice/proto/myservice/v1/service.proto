syntax = "proto3";

package myservice.v1;

option go_package = "github.com/panyam/grpcrouter/examples/myservice/v1";

import "grpcrouter/v1/options.proto";

// Example service that will be routed through the router
service MyService {
  option (grpcrouter.v1.routes_to) = {
    service: "MyService"
    routing_key: "instanceid"
    strategy: METADATA_BASED
    path_prefix: "/api/v1"
  };
  
  // Unary RPC
  rpc Method1(Method1Request) returns (Method1Response);
  
  // Server streaming RPC
  rpc ServerStreamedMethod(ServerStreamedMethodRequest) returns (stream ServerStreamedMethodResponse);
  
  // Client streaming RPC
  rpc ClientStreamedMethod(stream ClientStreamedMethodRequest) returns (ClientStreamedMethodResponse);
  
  // Bidirectional streaming RPC
  rpc BidirStreamMethod(stream BidirStreamMethodRequest) returns (stream BidirStreamMethodResponse);
}

message Method1Request {
  string data = 1;
  int32 value = 2;
}

message Method1Response {
  string result = 1;
  string instance_id = 2;
}

message ServerStreamedMethodRequest {
  repeated string items = 1;
}

message ServerStreamedMethodResponse {
  string item = 1;
  string result = 2;
  string instance_id = 3;
}

message ClientStreamedMethodRequest {
  string data = 1;
  int32 batch_id = 2;
}

message ClientStreamedMethodResponse {
  int32 total_processed = 1;
  string summary = 2;
  string instance_id = 3;
}

message BidirStreamMethodRequest {
  string message = 1;
  int32 sequence = 2;
}

message BidirStreamMethodResponse {
  string response = 1;
  int32 sequence = 2;
  string instance_id = 3;
}
